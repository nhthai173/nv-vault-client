[project]
name = "nv-vault"
version = "0.2.0"
description = "Command-line client for a team key vault server"
requires-python = ">=3.9"
dependencies = ["keyring>=24"]   # token in the OS store: Keychain / Credential Manager / Secret Service. Everything else is stdlib.

[project.scripts]
nv-vault = "nv_vault.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nv_vault"]

[project.optional-dependencies]
dev = ["pytest>=8"]
